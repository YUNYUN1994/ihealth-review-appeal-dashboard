<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>差评申诉周报｜截至 2026-10-02</title>
<style>
/* iHealth + Material 3 dashboard refresh — 2026-10-02 */
:root{
  --brand:#fc4c02;
  --brand-hover:#e84300;
  --brand-soft:#fff1eb;
  --brand-soft-2:#fff8f5;
  --ink:#101720;
  --ink-2:#2d3238;
  --muted:#68737f;
  --muted-2:#8a949e;
  --bg:#f5f7f8;
  --card:#ffffff;
  --line:#e3e7ea;
  --line-strong:#cfd5da;
  --green:#147d64;
  --green2:#e7f5f0;
  --orange:#a85b00;
  --orange2:#fff2df;
  --red:#b3261e;
  --red2:#ffedea;
  --blue:#246a9a;
  --blue2:#e9f3fa;
  --shadow:0 1px 2px rgba(16,23,32,.04),0 8px 24px rgba(16,23,32,.045);
  --shadow-hover:0 2px 4px rgba(16,23,32,.06),0 12px 28px rgba(16,23,32,.07);
  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:8px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:linear-gradient(180deg,#fff 0,#f8f9fa 270px,var(--bg) 540px);
  color:var(--ink);
  font-family:Lato,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,select{font:inherit}
button{touch-action:manipulation}
.wrap{max-width:1600px;margin:0 auto;padding:0 32px 56px}

/* Brand-led masthead */
.hero{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:28px;
  align-items:end;
  padding:24px 0 22px;
  margin:0 0 20px;
  border-bottom:1px solid var(--line);
}
.hero-title{min-width:0}
.brand-lockup{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.brand-wordmark{
  display:inline-flex;
  align-items:flex-start;
  color:var(--brand);
  font-family:Roboto,Lato,"Segoe UI",sans-serif;
  font-size:27px;
  font-weight:800;
  letter-spacing:-.055em;
  line-height:1;
}
.brand-wordmark sup{font-size:8px;line-height:1;margin:1px 0 0 2px;letter-spacing:0}
.brand-divider{width:1px;height:24px;background:var(--line-strong)}
.brand-context{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.eyebrow{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--brand);
  font-size:11px;
  font-weight:800;
  letter-spacing:.105em;
}
.eyebrow:before{content:"";width:22px;height:2px;border-radius:2px;background:var(--brand)}
h1,.hero h1{
  margin:7px 0 7px;
  color:var(--ink);
  font-family:Roboto,Lato,"PingFang SC",sans-serif;
  font-size:34px;
  font-weight:700;
  letter-spacing:-.035em;
  line-height:1.18;
}
.sub{color:var(--muted);font-size:13px}
.sub strong{color:var(--ink-2);font-weight:800}
.actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;max-width:690px}
.actions button{
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:1px solid var(--line-strong);
  border-radius:10px;
  padding:0 15px;
  background:#fff;
  color:var(--ink-2);
  font-size:13px;
  font-weight:750;
  cursor:pointer;
  box-shadow:none;
  transition:background .15s ease,border-color .15s ease,box-shadow .15s ease,transform .15s ease;
}
.actions button:hover{background:#f8f9fa;border-color:#b8c0c7;box-shadow:0 4px 12px rgba(16,23,32,.07);transform:translateY(-1px)}
.actions button:active{transform:none}
.actions button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.actions button.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.actions button:before{font-size:15px;line-height:1;font-weight:500}
.actions button.primary:before{content:"↗"}
#refreshButton:before{content:"↻";font-size:17px}
.auto-refresh-status,.refresh-status{
  min-height:34px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:0 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:750;
  white-space:nowrap;
}
.auto-refresh-status{color:#35675b;background:var(--green2);border:1px solid #c7e5da}
.auto-refresh-status:before{content:"";width:7px;height:7px;margin-right:6px;border-radius:50%;background:#2a9d79;box-shadow:0 0 0 3px rgba(42,157,121,.11)}
.refresh-status{color:var(--muted);background:#eef1f3;opacity:0;transform:translateY(-2px);transition:.2s ease}
.refresh-status.show{opacity:1;transform:none}
.refresh-status.loading{color:#8b4700;background:var(--orange2)}
.refresh-status.done{color:#35675b;background:var(--green2)}
.refresh-status.loading:before{content:"";width:12px;height:12px;margin-right:6px;border:2px solid #f2c48d;border-top-color:#a85b00;border-radius:50%;animation:refresh-spin .8s linear infinite}
@keyframes refresh-spin{to{transform:rotate(360deg)}}
.refresh-toast{position:fixed;right:26px;top:22px;z-index:80;display:flex;align-items:center;gap:8px;padding:11px 15px;border-radius:10px;background:#eff9f5;color:#35675b;border:1px solid #c7e5da;box-shadow:0 8px 24px rgba(16,23,32,.14);font-size:13px;font-weight:750;opacity:0;transform:translateY(-10px);pointer-events:none;transition:.2s ease}
.refresh-toast.show{opacity:1;transform:none}.refresh-toast:before{content:"✓";font-size:16px}

/* Executive KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:0 0 18px}
.kpi{
  position:relative;
  min-height:126px;
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:18px 19px 16px;
  box-shadow:var(--shadow);
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
}
.kpi:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:#aeb7bf}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:#d3d8dc}
.kpi .label{color:var(--muted);font-size:12px;font-weight:750;letter-spacing:.01em}
.kpi .value{margin-top:9px;color:var(--ink);font-family:Roboto,Lato,sans-serif;font-size:31px;font-weight:750;letter-spacing:-.04em;line-height:1.06;font-variant-numeric:tabular-nums}
.kpi .hint{margin-top:9px;color:var(--muted-2);font-size:11px;line-height:1.35}
.kpi.blue:before{background:var(--blue)}.kpi.blue .value{color:#185f8e}
.kpi.green:before{background:var(--green)}.kpi.green .value{color:var(--green)}
.kpi.orange:before{background:#d17b13}.kpi.orange .value{color:#9a5400}
.kpi.red:before{background:var(--brand)}.kpi.red .value{color:var(--brand)}

/* M3-style segmented navigation */
.tabs{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  gap:2px;
  align-items:center;
  width:max-content;
  max-width:100%;
  margin:0 0 20px;
  padding:5px;
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.94);
  box-shadow:0 5px 18px rgba(16,23,32,.055);
  backdrop-filter:blur(12px);
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  min-height:40px;
  flex:0 0 auto;
  border:0;
  border-radius:9px;
  padding:0 15px;
  background:transparent;
  color:#5c6670;
  font-size:13px;
  font-weight:750;
  cursor:pointer;
  transition:color .15s ease,background .15s ease,box-shadow .15s ease;
}
.tab:hover{background:#f3f5f6;color:var(--ink)}
.tab.active{background:var(--brand-soft);color:#b53800;box-shadow:inset 0 0 0 1px #ffd4c2}
.panel{display:none}.panel.active{display:block;animation:panel-in .2s ease-out}
@keyframes panel-in{from{opacity:.55;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Cards, layout and summaries */
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:16px;margin-bottom:16px}
.card{
  margin-bottom:16px;
  padding:22px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
}
.card h2{margin:0 0 5px;color:var(--ink);font-family:Roboto,Lato,"PingFang SC",sans-serif;font-size:19px;font-weight:700;letter-spacing:-.012em;line-height:1.3}
.card h3{margin:22px 0 11px;color:var(--ink-2);font-size:14px;font-weight:800}
.card .desc{margin:0 0 17px;color:var(--muted);font-size:12px;line-height:1.65}
.section-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:7px}
.summary-badge{display:inline-flex;align-items:center;flex:0 0 auto;border:1px solid #ffd5c3;border-radius:999px;background:var(--brand-soft);color:#a93605;padding:5px 9px;font-size:11px;font-weight:800;white-space:nowrap}
.owner-summary-card{margin-bottom:16px}
.total-card{margin:8px 0 16px;padding:14px 16px;border:1px solid #d7e0e5;border-left:4px solid var(--brand);border-radius:12px;background:linear-gradient(90deg,var(--brand-soft-2),#fff 48%);box-shadow:none}
.total-title{margin-bottom:10px;color:#7f3212;font-size:12px;font-weight:800;letter-spacing:.02em}
.total-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.total-item{min-width:0;padding:9px 10px;border:1px solid #e5e9ec;border-radius:9px;background:rgba(255,255,255,.86)}
.total-label{display:block;color:var(--muted);font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.total-value{display:block;margin-top:3px;color:var(--ink);font-family:Roboto,Lato,sans-serif;font-size:18px;font-weight:750;font-variant-numeric:tabular-nums}

/* Filters */
.filterbar{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin:0 0 5px;padding:0 0 14px;border-bottom:1px solid #edf0f2}
.filterbar>div:first-child{min-width:220px}.filterbar .filters{display:flex;justify-content:flex-end;align-items:center;gap:9px;flex-wrap:wrap}
.filterbar label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;font-weight:750;white-space:nowrap}
select{min-width:154px;min-height:40px;border:1px solid var(--line-strong);border-radius:9px;padding:0 34px 0 11px;background:#fff;color:var(--ink-2);font-size:12px;cursor:pointer;box-shadow:0 1px 2px rgba(16,23,32,.03)}
select:hover{border-color:#aeb6bd}
button:focus-visible,select:focus-visible,.tab:focus-visible,.sortable:focus-visible{outline:3px solid rgba(252,76,2,.22);outline-offset:2px}

/* Charts and direction summaries */
.barlist{display:flex;flex-direction:column;gap:13px}
.barrow{display:grid;grid-template-columns:minmax(115px,180px) minmax(110px,1fr) minmax(96px,118px);gap:13px;align-items:center;font-size:12px}
.barlabel{overflow:hidden;color:#46515b;font-weight:650;white-space:nowrap;text-overflow:ellipsis}
.bartrack{height:9px;overflow:hidden;border-radius:999px;background:#edf0f2}
.barfill{height:100%;min-width:2px;border-radius:999px;background:linear-gradient(90deg,#ff8a5a,var(--brand))}
.barvalue{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.barvalue strong{display:block;font-size:13px}.bar-sub{display:block;margin-top:2px;color:var(--green);font-size:11px;font-weight:800;white-space:nowrap}.bar-sub:before{content:"✓ ";font-weight:900}
.direction-list{display:flex;flex-wrap:wrap;gap:7px}.direction{padding:5px 9px;border:1px solid #e2e6e9;border-radius:999px;background:#f6f7f8;color:#46515b;font-size:11px}
.direction-text{display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px 6px;line-height:1.4}
.direction-text.compact{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-height:48px;overflow:hidden}
.direction-text span{display:block;min-width:0;padding:3px 6px;border:1px solid #eee4df;border-radius:6px;background:#fff8f5;color:#824022;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.direction-text .direction-more{background:#f1f3f4;border-color:#e1e5e8;color:#66717b;text-align:center}
.callout{display:flex;gap:11px;align-items:flex-start;margin-top:12px;padding:12px 14px;border:1px solid #f2d5a8;border-radius:11px;background:#fff9ed;color:#795019;font-size:12px;line-height:1.6}.callout strong{color:#704414}

/* Dense but readable data tables */
.table-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 2px 8px;color:var(--muted);font-size:11px}
.table-hint{display:inline-flex;align-items:center;gap:6px}.table-hint:before{content:"↕";display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:1px solid var(--line-strong);border-radius:50%;color:#717c86;font-size:11px}
.table-count{white-space:nowrap;font-variant-numeric:tabular-nums}
.table-wrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:11px;background:#fff;box-shadow:0 1px 2px rgba(16,23,32,.025)}
table{width:100%;min-width:860px;border-collapse:separate;border-spacing:0;background:#fff;font-size:11px;table-layout:fixed}
th,td{padding:10px 10px;border-bottom:1px solid #e9ecef;vertical-align:top;line-height:1.45}
th{position:sticky;top:0;z-index:2;background:#f4f6f7;color:#49545e;font-size:10px;font-weight:850;letter-spacing:.015em;text-align:left;white-space:nowrap}
th:first-child{border-top-left-radius:10px}th:last-child{border-top-right-radius:10px}
td{color:#323c45;overflow-wrap:anywhere}
tbody tr:nth-child(even):not(.total-row){background:#fbfcfc}
tbody tr:hover:not(.total-row){background:#fff7f3}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.sortable{cursor:pointer;user-select:none}.sortable:hover{background:#eceff1;color:var(--ink)}
.sort-indicator{display:inline-block;margin-left:4px;color:#9aa3aa;font-size:10px}.sortable[aria-sort=ascending] .sort-indicator,.sortable[aria-sort=descending] .sort-indicator{color:var(--brand);font-weight:900}
tr.total-row td{position:sticky;bottom:0;z-index:1;background:#fff0e9;color:#713015;font-weight:850;border-top:2px solid #ffc4a9;border-bottom:0}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:50px;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:850;white-space:nowrap}.pill.good{color:#176e59;background:var(--green2)}.pill.warn{color:#8d5000;background:var(--orange2)}.pill.bad{color:#9f2d26;background:var(--red2)}.pill.neutral{color:#64707a;background:#edf0f2}
.empty{padding:28px;border:1px dashed var(--line-strong);border-radius:11px;background:#fbfcfc;color:var(--muted);text-align:center}
.muted{color:var(--muted)}.small{font-size:11px}
.footer{padding:18px 0 0;color:#8a949e;font-size:11px;text-align:center}

@media (max-width:1200px){
  .wrap{padding:0 24px 48px}.hero{grid-template-columns:1fr;align-items:start;gap:16px}.actions{justify-content:flex-start;max-width:none}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr) minmax(300px,.82fr)}
}
@media (max-width:800px){
  body{background:var(--bg)}.wrap{padding:0 16px 38px}.hero{padding:18px 0}.brand-lockup{margin-bottom:14px}.hero h1{font-size:29px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{min-height:112px;padding:16px}.grid2{grid-template-columns:1fr;gap:0}.card{padding:18px;border-radius:15px}.filterbar{align-items:flex-start;flex-direction:column}.filterbar .filters{width:100%;justify-content:flex-start}.total-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tabs{width:100%;max-width:100%;margin-right:0;border-radius:12px}.table-wrap table{min-width:1280px}
}
@media (max-width:560px){
  .wrap{padding:0 12px 32px}.hero{gap:15px}.brand-wordmark{font-size:24px}.brand-context{font-size:10px}.hero h1{font-size:27px}.sub{font-size:12px}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}.actions button{width:100%;padding:0 10px}.actions .auto-refresh-status{grid-column:1/-1}.actions .refresh-status{grid-column:1/-1}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{min-height:108px;padding:14px}.kpi .value{font-size:26px}.tab{padding:0 13px}.card{padding:15px;border-radius:13px}.section-title-row{align-items:flex-start;flex-direction:column;gap:8px}.filterbar .filters{display:grid;grid-template-columns:1fr;width:100%}.filterbar label{display:grid;grid-template-columns:56px minmax(0,1fr);width:100%}.filterbar select{width:100%;min-width:0}.total-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.barrow{grid-template-columns:minmax(90px,125px) minmax(80px,1fr) minmax(82px,102px);gap:8px}.refresh-toast{left:12px;right:12px;top:12px;justify-content:center}
}
@media print{
  :root{--bg:#fff;--shadow:none}.wrap{max-width:none;padding:0}.hero{grid-template-columns:1fr;padding:0 0 14px}.brand-lockup{margin-bottom:10px}.actions,.tabs,.refresh-toast{display:none!important}.kpis{grid-template-columns:repeat(5,1fr)}.kpi,.card{break-inside:avoid;box-shadow:none}.panel{display:block!important}.panel:not(.active){margin-top:18px}.table-wrap{overflow:visible}.table-wrap table{min-width:0}.footer{padding-top:12px}
}


.refresh-status.error{color:#9f2d26;background:var(--red2);border:1px solid #f1c2bd}
.actions button:disabled{cursor:wait;opacity:.72;transform:none;box-shadow:none}

</style>
</head>
<body>
<div class="wrap">
<header class="hero"><div class="hero-title"><div class="brand-lockup"><span class="brand-wordmark">iHealth<sup>®</sup></span><span class="brand-divider" aria-hidden="true"></span><span class="brand-context">Review Operations</span></div><div class="eyebrow">AMAZON REVIEW APPEAL WEEKLY REPORT</div><h1>差评申诉周报</h1><div class="sub">统计截止：<strong>2026/10/2</strong>｜周次按周一至周日计算</div></div><div class="actions"><button class="primary" onclick="window.print()">打印 / 导出 PDF</button><button onclick="downloadData()">下载数据 JSON</button><button id="refreshButton" onclick="refreshPage()">刷新数据</button><span id="refreshStatus" class="refresh-status" aria-live="polite"></span><span id="autoRefreshStatus" class="auto-refresh-status" title="当前部署未创建自动刷新定时器">自动更新：未启用 · 手动刷新</span></div></header><div id="refreshToast" class="refresh-toast" role="status" aria-live="polite">刷新完成</div>

<main><section id="overview" class="panel active"></section><section id="product" class="panel"></section><section id="appeal" class="panel"></section><section id="review" class="panel"></section><section id="owner" class="panel"></section><section id="notes" class="panel"></section></main>
<div class="footer">本页面为差评申诉数据的静态周报展示；数据已按最新源表刷新，并以源表申诉状态作为删除判定依据。</div>

<script>

    const totalHtml=totalCard('留评时间维度当前筛选合计',[
      ['新增差评',fmtNum(sum(totals,'周新增差评数'))],
      ['已删除',fmtNum(sum(totals,'周已删除数'))],
      ['删除率',fmtPct(ratio(sum(totals,'周已删除数'),sum(totals,'周新增差评数')))]
    ]);
    document.getElementById('reviewTotalBox').innerHTML=totalHtml+table(totals.concat(totalReviewRow(totals,label)),[{key:'周次',label:'留评周'},{key:'周新增差评数',label:'新增差评',type:'num',num:true},{key:'周已删除数',label:'已删除',type:'num',num:true},{key:'已删除率',label:'删除占比',type:'pct',num:true}]);
    document.getElementById('reviewShareBox').innerHTML='<h3>留评周 × 产品占比</h3>'+table(shares.concat(totalReviewShareRow(shares,label)),[{key:'周次',label:'留评周'},{key:'产品',label:'产品'},{key:'负责人',label:'负责人'},{key:'新增差评数',label:'新增差评',type:'num',num:true},{key:'已删除数量',label:'已删除',type:'num',num:true},{key:'产品占比',label:'产品占比',type:'pct',num:true},{key:'已删除占比',label:'已删除占比',type:'pct',num:true}]);
  };
  document.getElementById('reviewWeekFilter').addEventListener('change',render);document.getElementById('reviewProductFilter').addEventListener('change',render);render();
}
function ownerSummaryRows(rows){
  const map=new Map();
  rows.forEach(r=>{const owner=String(r['负责人']||'未分配');if(!map.has(owner))map.set(owner,{负责人:owner,products:new Set(),申诉数量:0,已删除数量:0,状态空白数:0,待跟进数:0});const o=map.get(owner);String(r['负责产品']||'').split('、').filter(Boolean).forEach(p=>o.products.add(p));o.申诉数量+=Number(r['申诉数量']||0);o.已删除数量+=Number(r['已删除数量']||0);o.状态空白数+=Number(r['状态空白数']||0);o.待跟进数+=Number(r['待跟进数']||0);});
  return [...map.values()].map(o=>({负责人:o.负责人,负责产品:[...o.products].join('、'),申诉数量:o.申诉数量,已删除数量:o.已删除数量,申诉成功率:ratio(o.已删除数量,o.申诉数量),状态空白数:o.状态空白数,待跟进数:o.待跟进数})).sort((a,b)=>b.申诉数量-a.申诉数量);
}
function totalOwnerSummaryRow(rows){const n=sum(rows,'申诉数量'),deleted=sum(rows,'已删除数量');return {__total:true,负责人:'总计',负责产品:'全部产品',申诉数量:n,已删除数量:deleted,申诉成功率:ratio(deleted,n),状态空白数:sum(rows,'状态空白数'),待跟进数:sum(rows,'待跟进数')};}
function renderOwner(){

  const render=()=>{
    const w=document.getElementById('ownerWeekFilter').value,p=document.getElementById('ownerProductFilter').value,o=document.getElementById('ownerFilter').value;
    const rows=ownerWeek.filter(r=>(!w||r['周次']===w)&&(!o||r['负责人']===o)&&(!p||String(r['负责产品']||'').split('、').includes(p)));
    const summaryRows=ownerSummaryRows(rows);
    document.getElementById('ownerTotalBox').innerHTML=totalCard('负责人维度当前筛选合计',[['申诉数',fmtNum(sum(rows,'申诉数量'))],['已删除',fmtNum(sum(rows,'已删除数量'))],['成功率',fmtPct(ratio(sum(rows,'已删除数量'),sum(rows,'申诉数量')))],['状态空白',fmtNum(sum(rows,'状态空白数'))],['待跟进',fmtNum(sum(rows,'待跟进数'))]]);
    document.getElementById('ownerSummary').innerHTML='<div class="card owner-summary-card"><div class="section-title-row"><div><h2>负责人总计</h2><p class="desc">按当前筛选条件汇总每位负责人的全部申诉记录；默认按申诉数从高到低，可点击任意列排序。</p></div><span class="summary-badge">'+fmtNum(summaryRows.length)+' 位负责人</span></div>'+table(summaryRows.concat(summaryRows.length?[totalOwnerSummaryRow(summaryRows)]:[]),[{key:'负责人',label:'负责人'},{key:'负责产品',label:'负责产品'},{key:'申诉数量',label:'申诉数',type:'num',num:true},{key:'已删除数量',label:'已删除',type:'num',num:true},{key:'申诉成功率',label:'成功率',type:'pct',num:true},{key:'状态空白数',label:'状态空白',type:'num',num:true},{key:'待跟进数',label:'待跟进',type:'num',num:true}])+'</div>';
    document.getElementById('ownerTable').innerHTML='<div class="card"><h2>负责人周次明细</h2><p class="desc">按申诉周查看负责人负责的产品与处理结果；总计固定在底部。</p>'+table(rows.concat(totalOwnerRow(rows,w||'全部周次')),[{key:'周次',label:'申诉周'},{key:'负责人',label:'负责人'},{key:'负责产品',label:'负责产品'},{key:'申诉数量',label:'申诉数',type:'num',num:true},{key:'已删除数量',label:'已删除',type:'num',num:true},{key:'申诉成功率',label:'成功率',type:'pct',num:true},{key:'状态空白数',label:'状态空白',type:'num',num:true},{key:'待跟进数',label:'待跟进',type:'num',num:true}])+'</div>';
  };
  ['ownerWeekFilter','ownerProductFilter','ownerFilter'].forEach(id=>document.getElementById(id).addEventListener('change',render));render();
}
function renderNotes(){const noteRows=notes.filter(r=>r['项目']);document.getElementById('notes').innerHTML='<div class="card"><h2>统计口径与判定说明</h2>'+table(noteRows,[{key:'项目',label:'项目'},{key:'口径说明',label:'说明'}])+'</div><div class="card"><h2>删除判定</h2><p class="desc">本报表按源表申诉状态判定删除：状态包含“已删除”计入已删除，其他状态不计入；Amazon 前台核验结果仅作辅助参考。</p>'+table(linkNotes,[{key:'说明',label:'判定规则'},{key:'判定规则',label:'备注'}])+'</div>';}
function downloadData(){const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='差评申诉周报_data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function showRefreshDone(message='飞书数据已更新'){
  const status=document.getElementById('refreshStatus'),toast=document.getElementById('refreshToast'),btn=document.getElementById('refreshButton');
  if(btn){btn.disabled=false;btn.textContent='刷新数据';btn.removeAttribute('aria-busy');}
  if(status){status.textContent=message;status.className='refresh-status show done';}
  if(toast){toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3200);}
  setTimeout(()=>{if(status)status.classList.remove('show');},4200);
}
const REVIEW_REFRESH_API=(window.__REVIEW_APP_BASE_PATH__||'').replace(/\/$/,'');
function setRefreshProgress(message,state='loading'){
  const btn=document.getElementById('refreshButton'),status=document.getElementById('refreshStatus');
  if(btn){btn.disabled=true;btn.textContent='正在同步飞书…';btn.setAttribute('aria-busy','true');}
  if(status){status.textContent=message;status.className='refresh-status show '+state;}
}
function setRefreshError(message){
  const btn=document.getElementById('refreshButton'),status=document.getElementById('refreshStatus');
  if(btn){btn.disabled=false;btn.textContent='刷新数据';btn.removeAttribute('aria-busy');}
  if(status){status.textContent=message;status.className='refresh-status show error';}
}
async function fetchRefreshStatus(){
  const response=await fetch(REVIEW_REFRESH_API+'/api/refresh/status?t='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('无法读取刷新状态');
  return response.json();
}
async function waitForRefresh(){
  const deadline=Date.now()+35*60*1000;
  await new Promise(resolve=>setTimeout(resolve,700));
  while(Date.now()<deadline){
    const state=await fetchRefreshStatus();
    if(state.running){setRefreshProgress(state.progress||'正在重新抓取飞书数据…');await new Promise(resolve=>setTimeout(resolve,1500));continue;}
    if(state.lastError)throw new Error(state.lastError);
    return state;
  }
  throw new Error('刷新超时，请查看后台刷新日志');
}
async function refreshPage(trigger='manual'){
  setRefreshProgress('正在连接飞书并重新抓取数据…');
  try{
    const response=await fetch(REVIEW_REFRESH_API+'/api/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({trigger})});
    if(!response.ok&&response.status!==409){const payload=await response.json().catch(()=>({}));throw new Error(payload.message||'无法启动刷新任务');}
    const state=await waitForRefresh();
    try{sessionStorage.setItem('reviewReportRefreshing','1');sessionStorage.setItem('reviewReportRefreshTime',state.finishedAt||'');}catch(e){}
    setRefreshProgress('飞书数据已抓取，正在载入新网页…','done');
    setTimeout(()=>location.reload(),650);
  }catch(error){
    const offline=/Failed to fetch|NetworkError|无法读取刷新状态/.test(String(error&&error.message||error));
    setRefreshError(offline?'刷新服务未启动，请稍后重试':'刷新失败：'+String(error&&error.message||error).slice(0,90));
  }
}
try{if(sessionStorage.getItem('reviewReportRefreshing')==='1'){sessionStorage.removeItem('reviewReportRefreshing');setTimeout(()=>showRefreshDone('飞书数据已重新抓取并更新'),120);}}catch(e){}
function scheduleAutoRefresh(){
  const status=document.getElementById('autoRefreshStatus');
  if(status){status.textContent='自动更新：未启用 · 手动刷新';status.title='当前部署未创建自动刷新定时器，请点击“刷新数据”手动同步飞书';}
}
scheduleAutoRefresh();
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));btn.classList.add('active');document.getElementById(btn.dataset.panel).classList.add('active');}));
